[workspace]
resolver = "2"
members = [
    "crates/poa-core",
    "crates/poa-protocol",
    "crates/poa-sandbox",
    "crates/poa-verifier-example",
    "crates/hete-identity",
    "crates/hete-policy",
    "crates/hete-credential",
    "crates/hete-adapter-api",
    "crates/domain-electronic-warrant",
    "crates/domain-agent-delegation",
    "crates/adapter-simulated-asset",
    "crates/adapter-sqlite-asset",
    "crates/hete-warrant-verifier",
    "crates/publication-evaluation",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
ed25519-dalek = { version = "2", features = ["rand_core"] }
hex = "0.4"
jsonschema = { version = "0.33", default-features = false }
libc = "0.2"
regex = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
